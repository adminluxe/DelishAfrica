name: HF51 iOS 3.0.4 production candidate
on:
  push:
    branches: [qa/hf51-ios304-production-convergence-20261104]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hf51-ios304-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-production-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      APP_VARIANT: production
      EXPO_PUBLIC_RELEASE_RING: production
      EXPO_PUBLIC_API_BASE_URL: https://api.delishafrica.me/api/v1
      EXPO_PUBLIC_API_URL: https://api.delishafrica.me/api/v1
      npm_config_registry: https://registry.npmjs.org/
      npm_config_fetch_retries: "1"
      npm_config_fetch_timeout: "30000"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify immutable source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
      - name: Frozen dependencies without lifecycle scripts
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile --ignore-scripts --filter client --filter merchant --filter courier --filter ./services/api-nest
      - name: Three applications TypeScript
        run: |
          for app in client merchant courier; do pnpm --dir "apps/$app" exec tsc --noEmit --pretty false; done
      - name: API compatibility and signed authorization tests
        run: |
          pnpm --dir services/api-nest run build
          node --test services/api-nest/test/trusted-identity-multi-audience.qa.test.cjs services/api-nest/test/hf26-oidc-merchant-routes.qa.test.cjs
      - name: Actual decoder compatibility and malformed input
        run: node scripts/qa/decoder-compatibility-regression.cjs
      - name: Production identity and configuration
        run: node scripts/qa/hf51-ios-production-config.cjs
      - name: Three iOS Hermes exports
        run: |
          for app in client merchant courier; do
            pnpm --dir "apps/$app" exec expo export --platform ios --source-maps --output-dir "$RUNNER_TEMP/hf51-ios-$app"
          done
      - name: Production dependency graph HIGH or CRITICAL must be zero
        run: timeout 300s pnpm audit --prod --audit-level high
      - name: Full dependency graph HIGH or CRITICAL must be zero
        run: timeout 300s pnpm audit --audit-level high
