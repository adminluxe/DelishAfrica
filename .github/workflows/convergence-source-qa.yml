name: Convergence source QA
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "qa/ataraxie/**"
      - "scripts/**"
      - "patches/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/convergence-source-qa.yml"
permissions:
  contents: read
concurrency:
  group: convergence-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            apps
            packages
            services
            scripts
            qa
            patches
            .github
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
      - name: Exact pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = "9.15.4"
      - name: Frozen graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --filter client --filter courier --filter merchant --filter ./services/api-nest --filter ./apps/landing
      - name: Exact iOS and Android candidate configuration
        run: |
          node scripts/qa/hf51-ios-production-config.cjs
          node scripts/qa/hf51-android-closed-config.cjs
      - name: TypeScript all three applications
        run: |
          pnpm --dir apps/client exec tsc --noEmit --pretty false
          pnpm --dir apps/courier exec tsc --noEmit --pretty false
          pnpm --dir apps/merchant exec tsc --noEmit --pretty false
      - name: API and landing builds
        run: |
          pnpm --dir services/api-nest run build
          pnpm --dir apps/landing run build
      - name: Synthetic identity presence and session isolation
        run: |
          unset DA_HF33_BASELINE
          node --test qa/ataraxie/hf33-merchant-identity.test.cjs qa/ataraxie/hf33-courier-presence.test.cjs qa/ataraxie/hf33-canonical-sessions.test.cjs qa/ataraxie/hf33-oidc-races.test.cjs
      - name: Six unsigned Hermes exports
        run: |
          unset EXPO_NO_METRO_WORKSPACE_ROOT
          for app in client courier merchant; do
            for platform in ios android; do
              out="$RUNNER_TEMP/convergence-$app-$platform"
              (cd "apps/$app" && APP_VARIANT=production pnpm exec expo export --platform "$platform" --source-maps --max-workers 2 --output-dir "$out")
              test -f "$out/metadata.json"
              test "$(find "$out/_expo/static/js/$platform" -name '*.hbc' | wc -l)" -eq 1
            done
          done
      - name: FULL audit unchanged HIGH threshold
        run: timeout 300s pnpm audit --audit-level high
      - name: PROD audit unchanged HIGH threshold
        run: timeout 300s pnpm audit --prod --audit-level high
