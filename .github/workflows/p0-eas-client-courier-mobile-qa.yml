name: P0 EAS Client Courier mobile QA

on:
  push:
    branches:
      - release/p0-ios-client-courier-ux-candidate-20261015
  pull_request:
    branches:
      - release/p0-ios-client-courier-eas-baseline-20261015

permissions:
  contents: read

concurrency:
  group: p0-eas-client-courier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-mobile:
    name: typecheck-and-authentic-ios-android-hermes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      APP_VARIANT: development
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout immutable candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Activate pnpm 9.15.4
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = "9.15.4"
      - name: Frozen installation with lifecycle scripts disabled
        run: pnpm install --frozen-lockfile --ignore-scripts --filter client --filter courier
      - name: client TypeScript
        run: pnpm --dir apps/client exec tsc --noEmit
      - name: courier TypeScript
        run: pnpm --dir apps/courier exec tsc --noEmit
      - name: Guard onboarding V2 paths against legacy enrollment and fake identities
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          for (const role of ["client","courier"]) {
            const read = (f) => fs.readFileSync(path.join('apps',role,f),'utf8');
            const home = read('app/index.tsx');
            const page = read('app/onboarding.tsx');
            const files = role === 'merchant' ? ['utils/daMerchantOidc.ts','app/auth/login.tsx'] : ['hooks/useDaPkceAuth.ts','auth/daOidcConfig.ts'];
            const lib = files.map(read).join('\n');
            if (!home.includes('/onboarding') || !page.includes('Créer mon compte') || !page.includes('J’ai déjà un compte') || !page.includes("begin('register')")) throw Error(role + ': onboarding not reachable');
            if (!lib.includes('Constants.expoConfig?.scheme') || !lib.includes('prompt:')) throw Error(role + ': no native callback or registration intent');
            if (lib.includes('DEV_TOKEN') || lib.includes('dev:${')) throw Error(role+': fake identity remains reachable');
            if (!read('app/auth-session.tsx').includes("'./onboarding'")) throw Error(role+': stale authentication entry');
            if (role === 'merchant' && !read('app/auth/login.tsx').includes("'../onboarding'")) throw Error('Merchant legacy fake login not retired');
            if (role === 'client' && !read('app/secure-session.tsx').includes("'./onboarding'")) throw Error('Client checkout gateway not upgraded');
            console.log('PASS ONBOARDING_V2 '+role);
          }
          NODE
      - name: Assert DEV native deep-link scheme matches the actual Expo manifest
        run: |
          (cd apps/client && APP_VARIANT=development pnpm exec expo config --json) | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const x=JSON.parse(s);const role="client";const scheme="delishafrica"+role+"dev";const id="com.delishafrica."+role+".dev";if(x.scheme!==scheme || x.ios?.bundleIdentifier!==id)throw Error("INVALID_DEV_CALLBACK_SCHEME "+role);console.log("PASS DEV_CALLBACK "+role);})'
          (cd apps/courier && APP_VARIANT=development pnpm exec expo config --json) | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const x=JSON.parse(s);const role="courier";const scheme="delishafrica"+role+"dev";const id="com.delishafrica."+role+".dev";if(x.scheme!==scheme || x.ios?.bundleIdentifier!==id)throw Error("INVALID_DEV_CALLBACK_SCHEME "+role);console.log("PASS DEV_CALLBACK "+role);})'
      - name: Export JavaScript only - no EAS native build, OTA or Store push
        run: |
          unset EXPO_NO_METRO_WORKSPACE_ROOT
          (cd apps/client && pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/da-client-ios")
          (cd apps/client && pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/da-client-android")
          (cd apps/courier && pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/da-courier-ios")
          (cd apps/courier && pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/da-courier-android")
      - name: Fail closed if Expo outputs generic Router shell instead of real app
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const apps = ["client","courier"];
          for (const app of apps) {
            for (const platform of ['ios', 'android']) {
              const root = path.join(process.env.RUNNER_TEMP, 'da-' + app + '-' + platform);
              const metadata = JSON.parse(fs.readFileSync(path.join(root,'metadata.json'),'utf8'));
              const assets = metadata.fileMetadata?.[platform]?.assets || [];
              const dir = path.join(root,'_expo/static/js',platform);
              const names = fs.readdirSync(dir).filter(n => n.endsWith('.hbc'));
              if (names.length !== 1 || assets.length < 28) throw new Error(app+'/'+platform+': incomplete export');
              const code = fs.readFileSync(path.join(dir,names[0]));
              if (code.length < 2800000 || !code.includes(Buffer.from('DELISHAFRICA')) ||
                  !code.includes(Buffer.from(app+'-h2o'))) throw new Error(app+'/'+platform+': wrong app or missing premium assets');
              console.log('PASS '+app+'/'+platform+': '+code.length+' HBC bytes, '+assets.length+' asset references');
            }
          }
          NODE
