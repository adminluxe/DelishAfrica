name: Store Triad Release QA

on:
  push:
    branches:
      - release/store-triad-signup-20261021
  pull_request:
    paths:
      - "apps/client/**"
      - "apps/merchant/**"
      - "apps/courier/**"
      - "services/api-nest/**"
      - "scripts/da_store_candidate_contract_tests.cjs"
      - "scripts/da_store_bundle_dependency_attestation.cjs"
      - "scripts/qa_pog_security_backports.cjs"
      - "vendor/pog-security/**"
      - "patches/**"
      - ".easignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/store-triad-release-qa.yml"

permissions:
  contents: read

concurrency:
  group: store-triad-release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triad:
    name: typecheck-config-hermes-security
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact immutable candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "RELEASE_CANDIDATE_SHA=$actual"

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: pnpm 9.15.4
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = "9.15.4"

      - name: Frozen install without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts \
            --filter client --filter merchant --filter courier --filter ./services/api-nest

      - name: TypeScript 3 apps
        run: |
          pnpm --dir apps/client exec tsc --noEmit --pretty false
          pnpm --dir apps/merchant exec tsc --noEmit --pretty false
          pnpm --dir apps/courier exec tsc --noEmit --pretty false

      - name: Nest API build
        run: pnpm --dir services/api-nest run build

      - name: Client cart catalog zone and map regression contracts
        run: node scripts/da_store_candidate_contract_tests.cjs

      - name: POG private security backports provenance and adversarial checks
        run: node scripts/qa_pog_security_backports.cjs

      - name: Internal auth fail-closed contract
        run: |
          grep -q "DA_INTERNAL_AUTH_ENABLED" services/api-nest/src/auth/auth.service.ts
          grep -q "internal_auth_disabled" services/api-nest/src/auth/auth.service.ts
          grep -q "auth_secret_unavailable" services/api-nest/src/auth/auth.service.ts
          grep -q "if (this.internalAuthEnabled())" services/api-nest/src/auth/auth.service.ts
          if grep -q "update(path.resolve(process.cwd()))" services/api-nest/src/auth/auth.service.ts; then
            echo "Predictable internal auth secret fallback detected"
            exit 1
          fi

      - name: Identity lifecycle contract
        run: |
          test -f services/api-nest/src/identity-lifecycle/identity-lifecycle.module.ts
          test -f services/api-nest/src/identity-lifecycle/identity-lifecycle.controller.ts
          test -f services/api-nest/src/identity-lifecycle/identity-lifecycle.service.ts
          test -f services/api-nest/src/identity-lifecycle/identity-lifecycle.repository.ts
          test -f services/api-nest/migrations/identity-lifecycle/20261021_001_account_deletion.sql
          grep -q "IdentityLifecycleModule" services/api-nest/src/app.module.ts
          grep -q "account-deletion" services/api-nest/src/identity-lifecycle/identity-lifecycle.controller.ts
          grep -q "DA_IDENTITY_LIFECYCLE_SECRET_FILE" services/api-nest/src/identity-lifecycle/identity-lifecycle.crypto.ts
          grep -q "DA_INVITATION_ENCRYPTION_KEY_FILE" services/api-nest/src/identity-lifecycle/identity-lifecycle.crypto.ts
          grep -q "identity_lifecycle_secret_unavailable" services/api-nest/src/identity-lifecycle/identity-lifecycle.crypto.ts
          grep -q "identity_fingerprint" services/api-nest/migrations/identity-lifecycle/20261021_001_account_deletion.sql
          grep -q "verifyRegistrationAuthorization" services/api-nest/src/auth/auth.service.ts
          grep -q "verifyRegistrationAuthorization" services/api-nest/src/identity-lifecycle/identity-lifecycle.service.ts
          if grep -q "resolvePrincipalFromAuthorization" services/api-nest/src/identity-lifecycle/identity-lifecycle.service.ts; then
            echo "Account deletion must support verified pending identities without professional role admission"
            exit 1
          fi

      - name: Production manifest invariants 3 apps
        run: |
          for app in client merchant courier; do
            (cd "apps/$app" && APP_VARIANT=production pnpm exec expo config --json) > "$RUNNER_TEMP/$app-production.json"
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const roles = ['client','merchant','courier'];
          for (const role of roles) {
            const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/' + role + '-production.json','utf8'));
            const id = 'com.delishafrica.' + role;
            const scheme = 'delishafrica' + role;
            if (x.version !== '3.0.2') throw new Error(role + ': wrong version ' + x.version);
            if (x.ios?.bundleIdentifier !== id || x.android?.package !== id) throw new Error(role + ': wrong package id');
            if (!(x.scheme === scheme || Array.isArray(x.scheme) && x.scheme.includes(scheme))) throw new Error(role + ': wrong scheme');
            if (x.extra?.daEnrollment) throw new Error(role + ': QA enrollment leaked into Store manifest');
            if (x.android?.allowBackup !== false) throw new Error(role + ': Android backup must be disabled');
            const blocked = new Set(x.android?.blockedPermissions || []);
            for (const p of [
              'android.permission.SYSTEM_ALERT_WINDOW',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.USE_BIOMETRIC',
              'android.permission.USE_FINGERPRINT',
            ]) {
              if (!blocked.has(p)) throw new Error(role + ': missing blocked permission ' + p);
            }
            console.log('PASS STORE_MANIFEST ' + role);
          }
          NODE

      - name: Merchant foreground location purpose
        run: |
          grep -q '"expo-location"' apps/merchant/app.config.ts
          grep -q 'locationWhenInUsePermission' apps/merchant/app.config.ts
          if grep -q 'NSCameraUsageDescription' apps/client/app.config.js; then
            echo "Client declares an unused camera purpose"
            exit 1
          fi

      - name: Development manifests remain isolated
        run: |
          for app in client merchant courier; do
            (cd "apps/$app" && APP_VARIANT=development pnpm exec expo config --json) > "$RUNNER_TEMP/$app-development.json"
          done
          node - <<'NODE'
          const fs = require('node:fs');
          for (const role of ['client','merchant','courier']) {
            const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/' + role + '-development.json','utf8'));
            const id = 'com.delishafrica.' + role + '.dev';
            const scheme = 'delishafrica' + role + 'dev';
            if (x.ios?.bundleIdentifier !== id || x.android?.package !== id) throw new Error(role + ': DEV package isolation failed');
            if (!(x.scheme === scheme || Array.isArray(x.scheme) && x.scheme.includes(scheme))) throw new Error(role + ': DEV scheme isolation failed');
            console.log('PASS DEV_ISOLATION ' + role);
          }
          NODE

      - name: Merchant account scope isolation
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'merchant_thieyp' apps/merchant; then
            echo "Hard-coded Merchant identity detected"
            exit 1
          fi
          grep -q 'requireExternalMerchantPrincipal(false)' apps/merchant/utils/daOrdersApi.ts
          if grep -q "return 'merchant_" apps/merchant/utils/daOrdersApi.ts; then
            echo "Merchant local scope contains a hard-coded identity fallback"
            exit 1
          fi

      - name: Account deletion contract is wired 3 apps
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const role of ['client','merchant','courier']) {
            const p = 'apps/' + role + '/app/account-deletion.tsx';
            const s = fs.readFileSync(p,'utf8');
            for (const needle of [
              '/account-deletion/requests/',
              'DELETE_MY_DELISHAFRICA_ACCOUNT',
              'Idempotency-Key',
              'acknowledgeRetention: true',
              'status !== 202',
              'keycloak.afritaste.delishafrica.me',
              'account-delete-open',
            ]) {
              if (!s.includes(needle)) throw new Error(role + ': missing deletion guard ' + needle);
            }
            if (s.includes('Linking.openURL(ACCOUNT_CONSOLE)')) throw new Error(role + ': direct IAM deletion bypass reintroduced');
            console.log('PASS ACCOUNT_DELETION ' + role);
          }
          NODE

      - name: No obvious production secrets in app sources
        run: |
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git \
            'sk_live_[A-Za-z0-9]{16,}|rk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            apps/client apps/merchant apps/courier services/api-nest/src patches; then
            echo "Potential secret detected"
            exit 1
          fi

      - name: Production Hermes exports 6 of 6
        run: |
          unset EXPO_NO_METRO_WORKSPACE_ROOT
          for app in client merchant courier; do
            for platform in ios android; do
              out="$RUNNER_TEMP/da-$app-$platform"
              (cd "apps/$app" && APP_VARIANT=production pnpm exec expo export --platform "$platform" --source-maps --max-workers 2 --output-dir "$out")
              test -f "$out/metadata.json"
              test "$(find "$out/_expo/static/js/$platform" -name '*.hbc' | wc -l)" -eq 1
            done
          done

      - name: Verify all six mobile bundle dependency source maps
        run: node scripts/da_store_bundle_dependency_attestation.cjs "$RUNNER_TEMP"

      - name: Runtime dependency audit high or critical
        run: |
          set +e
          NODE_OPTIONS=--max-old-space-size=4096 timeout 300s pnpm audit --prod --audit-level high
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "Dependency audit timed out after 300s; release fails closed."
            exit 1
          fi
          if [ "$code" -eq 134 ] || [ "$code" -eq 137 ]; then
            echo "Dependency audit exhausted runner resources; release fails closed."
            exit 1
          fi
          exit "$code"

      - name: Private backport release admission — explicit NO-GO
        if: always()
        run: node scripts/qa_pog_security_backports.cjs --release-gate
