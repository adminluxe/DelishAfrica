name: DelishAfrica landing hardening

on:
  push:
    branches:
      - main
      - audit/landing-hardening-20260929
  pull_request:
    branches:
      - main
      - release/landing-warmth-v11-final-5d9a53cab39b
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Enforce landing performance budget
        run: node scripts/check-performance-budget.mjs dist
      - name: Validate certified VPS deploy script
        run: bash -n ops/deploy-certified-vps-20260929.sh
      - name: Verify public legal/SEO files
        run: |
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/site.webmanifest.json
          test -f public/delish-theme-v2.css\n          test -f public/theme-controller-v3.js
          grep -q '<urlset' public/sitemap.xml
          grep -q 'https://delishafrica.me/' public/sitemap.xml
          grep -q 'Allow: /' public/robots.txt
          grep -q 'Sitemap: https://delishafrica.me/sitemap.xml' public/robots.txt
          test -f src/pages/cookies/index.astro
          test -f src/pages/terms/index.astro
          test -f src/pages/legal/index.astro
          test -f src/pages/photo-credits/index.astro
          test ! -e public/data/intake-contract.private.json
          test ! -e public/data/smart-links.prepared.json
          test ! -e public/scripts/private-interactions.js
          test ! -e src/pages/lab/smart-links/index.astro
          test ! -e src/pages/en/lab/smart-links/index.astro
          test ! -e src/pages/devenir-coursier/simulateur/index.astro
          test ! -e src/pages/en/become-a-courier/simulator/index.astro
          ! grep -RniE 'PRIVATE SMART LINK LAB|LABORATOIRE SMART LINK PRIV|SYNTHETIC SIMULATOR|SIMULATEUR SYNTH' src public --exclude-dir=dist
