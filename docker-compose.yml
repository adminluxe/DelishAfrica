services:
  db:
    image: postgres:15
    container_name: delish-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: delish_db
      POSTGRES_USER: delish
      POSTGRES_PASSWORD: 131f2648e324b0d37ced7c8c265d3718afa0d28a6e26f86a69e7173fef0edeab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delish -d delish_db"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    container_name: delish-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: node:20-bullseye
    container_name: delish-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: "3010"
      DATABASE_URL: "postgresql://delish:wp8FeV6QsI50mWHrqn7qIWtwoTOj7KQE8T_SiB3N2wTP0E9P6PV49RU3K8GPJCdE@db:5432/delish_db"
      REDIS_URL: "redis://redis:6379"
      API_DIR: "/app/services/api-nest"
      DA_OPS_AUTHORITY_SECRET_FILE: "/run/secrets/da-ops-authority-v1"
      DA_OPS_AUTHORITY_KEY_ID: "ops-authority-v1"
      DA_OPS_AUTHORITY_MAX_SKEW_SECONDS: "60"
      DA_INVITATION_ENCRYPTION_KEY_FILE: "/run/secrets/da-invitation-encryption-v1"
      DA_INVITATION_ENCRYPTION_KEY_ID: "invitation-encryption-v1"
      INVITATION_WRITES: "0"
      INVITATION_ACCEPTANCE_WRITES: "1"
      DA_PROVIDER_BRIDGE_EXTERNAL_CALLS: "0"
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - ./:/app
      - api_root_node_modules:/app/node_modules
      - api_nest_node_modules:/app/services/api-nest/node_modules
      - /opt/delishafrica/secrets/da_ops_authority_v1.key:/run/secrets/da-ops-authority-v1:ro
      - /opt/delishafrica/secrets/da_invitation_encryption_v1.key:/run/secrets/da-invitation-encryption-v1:ro
    command:
      - bash
      - -lc
      - |
        set -euo pipefail

        echo "=== Delish API (api-nest) ==="
        echo "ROOT=/app"
        echo "API_DIR=$$API_DIR"

        # Auto-découverte si API_DIR est vide ou mauvais
        if [ -z "$$API_DIR" ] || [ ! -d "$$API_DIR" ]; then
          echo "⚠️ API_DIR invalide. Tentative auto-detection via nest-cli.json…"
          GUESS_NEST="$$(
            find /app -maxdepth 7 -name nest-cli.json -print -quit 2>/dev/null || true
          )"
          if [ -n "$$GUESS_NEST" ]; then
            API_DIR="$$(dirname "$$GUESS_NEST")"
            echo "✅ API_DIR détecté: $$API_DIR"
          fi
        fi

        if [ ! -f "$$API_DIR/package.json" ]; then
          echo "❌ package.json introuvable: $$API_DIR/package.json"
          echo "🔎 package.json trouvés (maxdepth 7):"
          find /app -maxdepth 7 -name package.json | head -n 80 || true
          echo "🔎 Contenu /app/services:"
          ls -la /app/services 2>/dev/null || true
          exit 1
        fi

        corepack enable >/dev/null 2>&1 || true

        echo "→ pnpm install (root)…"
        cd /app
        pnpm install --no-frozen-lockfile

        echo "→ Détection scripts API…"
        cd "$$API_DIR"
        SCRIPTS="$$(
          node -e "const s=require('./package.json').scripts||{}; console.log(Object.keys(s).join(' '))"
        )"
        if [ -z "$$SCRIPTS" ]; then
          echo "Scripts: <none>"
        else
          echo "Scripts: $$SCRIPTS"
        fi

        pick=""
        if echo " $$SCRIPTS " | grep -qw "start:dev"; then pick="start"; fi
        if [ -z "$$pick" ] && echo " $$SCRIPTS " | grep -qw "dev"; then pick="start:dev"; fi
        if [ -z "$$pick" ] && echo " $$SCRIPTS " | grep -qw "start"; then pick="dev"; fi

        if [ -n "$$pick" ]; then
          echo "✅ Lancement via script: pnpm run $$pick"
          exec pnpm run "$$pick"
        fi

        echo "⚠️ Aucun script standard trouvé. Tentative via Nest CLI…"
        if pnpm exec nest --help >/dev/null 2>&1; then
          echo "✅ pnpm exec nest start --watch"
          exec pnpm exec nest start --watch
        fi

        echo "⚠️ Nest CLI absent. Tentative dist/main.js…"
        if [ -f dist/main.js ]; then
          echo "✅ node dist/main.js"
          exec node dist/main.js
        fi

        echo "❌ Impossible de démarrer l'API: aucun script, Nest CLI absent, et dist/main.js absent."
        exit 2

volumes:
  pgdata:
  api_root_node_modules:
  api_nest_node_modules:
